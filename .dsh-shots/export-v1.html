<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Vidrio — fresnel</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #ececec; }
  .container { width: 100vw; height: 100vh; }
  .container canvas { display: block; }
</style>
</head>
<body>
<div class="container"></div>

<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/three.module.js",
    "three/addons/": "./vendor/three/addons/"
  }
}
</script>

<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

/* ------------------------------------------------------------------ */
/* 1. Contenedor, canvas, renderer, escena y cámara                    */
/* ------------------------------------------------------------------ */
const container = document.querySelector(".container");
const canvas = document.createElement("canvas");
container.appendChild(canvas);

const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;

const scene = new THREE.Scene();
scene.background = new THREE.Color("#ececec");

const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
camera.position.set(0, 0.2, 6.5);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 0.2, 0);

function resize() {
  const w = container.clientWidth, h = container.clientHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
}
resize();
window.addEventListener("resize", resize);

// Entorno neutro de estudio (solo para que el material por defecto reciba luz
// ambiental y reflejos suaves; no hay luces de entorno con color).
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

/* ------------------------------------------------------------------ */
/* 2. Material: MeshPhysicalMaterial por defecto + shader fresnel      */
/* ------------------------------------------------------------------ */
const mat = new THREE.MeshPhysicalMaterial();

mat.onBeforeCompile = (shader) => {
  shader.fragmentShader = shader.fragmentShader
    .replace(
      "#include <common>",
      `#include <common>

      /* --- Configuración del fresnel (constantes, sin uniforms) --- */
      #define F_INTENSITY      1.0
      #define F_HUE_OFFSET     0.55
      #define F_HUE_SPEED      1.2
      #define F_SATURATION     0.85
      #define F_WARP_FREQ      2.0
      #define F_WARP_STRENGTH  0.25

      vec3 hsv2rgb( vec3 c ) {
        vec4 K = vec4( 1.0, 2.0 / 3.0, 1.0 / 3.0, 3.0 );
        vec3 p = abs( fract( c.xxx + K.xyz ) * 6.0 - K.www );
        return c.z * mix( K.xxx, clamp( p - K.xxx, 0.0, 1.0 ), c.y );
      }`
    )
    .replace(
      "#include <opaque_fragment>",
      `
      {
        vec3 viewDir = normalize( vViewPosition );
        float fres = 1.0 - abs( dot( normal, viewDir ) );

        // Ondulación fija sobre la normal: da variación orgánica al color.
        float swirl = 0.5 + 0.5 * sin(
          3.0 * normal.x + 3.0 * normal.y + 2.0 * normal.z
        );
        float t = fres * 1.1 + swirl * 0.85;

        // Gradiente de tono + deformación (desvía el verde).
        float p = fract( F_HUE_OFFSET + t * F_HUE_SPEED );
        float warpedP = p + sin( p * 3.1415927 * F_WARP_FREQ ) * F_WARP_STRENGTH;
        vec3 fresnelColor = hsv2rgb( vec3( fract( warpedP ), F_SATURATION, 1.0 ) );

        // Los bordes (ángulo rasante) reciben más color.
        float band = smoothstep( 0.05, 0.8, fres );
        float amt = clamp( ( 0.12 + 1.1 * band ) * F_INTENSITY, 0.0, 0.95 );

        outgoingLight = mix( outgoingLight, fresnelColor, amt );
      }
      #include <opaque_fragment>`
    );
};

/* ------------------------------------------------------------------ */
/* 3. Modelo                                                           */
/* ------------------------------------------------------------------ */
const loader = new GLTFLoader();
let model;

loader.load("metaballs.glb", (gltf) => {
  model = gltf.scene;

  const box = new THREE.Box3().setFromObject(model);
  const center = new THREE.Vector3();
  box.getCenter(center);
  model.position.sub(center);

  // Escalar para que la altura ocupe ~4.2 unidades (mismo encuadre).
  const size = new THREE.Vector3();
  box.getSize(size);
  const s = 4.2 / Math.max(size.y, 0.0001);
  model.scale.setScalar(s);

  model.traverse((o) => {
    if (o.isMesh) o.material = mat;
  });

  scene.add(model);
}, undefined, (e) => console.error("GLB:", e));

/* ------------------------------------------------------------------ */
/* 4. Una sola luz                                                     */
/* ------------------------------------------------------------------ */
const light = new THREE.SpotLight(0xffffff, 30, 20, Math.PI / 6, 0.6, 1);
light.position.set(4, 3.2, 4);
light.target.position.set(0, 0.2, 0);
scene.add(light, light.target);

/* ------------------------------------------------------------------ */
/* 5. Loop                                                             */
/* ------------------------------------------------------------------ */
const clock = new THREE.Clock();
const OBJECT_SPEED = 0.35;   // rad/s

function animate() {
  requestAnimationFrame(animate);

  const dt = Math.min(clock.getDelta(), 0.1);
  if (model) model.rotation.y += OBJECT_SPEED * dt;

  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
